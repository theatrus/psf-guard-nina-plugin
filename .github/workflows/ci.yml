name: ci

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: true
      DOTNET_NOLOGO: true
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            src/PsfGuard.Nina.Plugin/packages.lock.json
            src/PsfGuard.Nina.Sync/packages.lock.json
            tests/PsfGuard.Nina.Sync.Tests/packages.lock.json

      - name: Restore locked dependencies
        run: dotnet restore PsfGuard.Nina.sln --locked-mode

      - name: Verify formatting
        run: dotnet format PsfGuard.Nina.sln --verify-no-changes --no-restore

      - name: Test sync library
        run: >-
          dotnet test tests\PsfGuard.Nina.Sync.Tests\PsfGuard.Nina.Sync.Tests.csproj
          --configuration Release
          --no-restore
          --logger "trx;LogFileName=sync-tests.trx"
          --results-directory artifacts\test-results

      - name: Build N.I.N.A. plugin
        run: >-
          dotnet build src\PsfGuard.Nina.Plugin\PsfGuard.Nina.Plugin.csproj
          --configuration Release
          --no-restore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: ignore
